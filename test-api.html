<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .success { color: green; }
        .error { color: red; }
        button { margin: 5px; padding: 10px; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>API Test Page</h1>
    
    <div class="test-section">
        <h2>Test SPA Routes</h2>
        <button onclick="testRoute('/')">Test Home</button>
        <button onclick="testRoute('/admin')">Test Admin</button>
        <button onclick="testRoute('/admin/users')">Test Users</button>
        <button onclick="testRoute('/admin/roles')">Test Roles</button>
        <button onclick="testRoute('/admin/posts')">Test Posts</button>
        <div id="route-results"></div>
    </div>

    <div class="test-section">
        <h2>Test API Endpoints</h2>
        <button onclick="testAPI('/api/v1/admin/users/list')">Test Users API</button>
        <button onclick="testAPI('/api/v1/admin/roles/list')">Test Roles API</button>
        <button onclick="testAPI('/api/v1/admin/posts/list')">Test Posts API</button>
        <div id="api-results"></div>
    </div>

    <div class="test-section">
        <h2>Test Vue Components</h2>
        <button onclick="testVueApp()">Test Vue App Mount</button>
        <div id="vue-results"></div>
    </div>

    <script>
        function testRoute(route) {
            const resultsDiv = document.getElementById('route-results');
            
            fetch(`http://web.local:8000${route}`)
                .then(response => {
                    if (response.ok) {
                        resultsDiv.innerHTML += `<p class="success">✓ Route ${route} - Status: ${response.status}</p>`;
                    } else {
                        resultsDiv.innerHTML += `<p class="error">✗ Route ${route} - Status: ${response.status}</p>`;
                    }
                })
                .catch(error => {
                    resultsDiv.innerHTML += `<p class="error">✗ Route ${route} - Error: ${error.message}</p>`;
                });
        }

        function testAPI(endpoint) {
            const resultsDiv = document.getElementById('api-results');
            
            fetch(`http://web.local:8000${endpoint}`)
                .then(response => response.json())
                .then(data => {
                    resultsDiv.innerHTML += `<p class="success">✓ API ${endpoint} - Success</p>`;
                    resultsDiv.innerHTML += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                })
                .catch(error => {
                    resultsDiv.innerHTML += `<p class="error">✗ API ${endpoint} - Error: ${error.message}</p>`;
                });
        }

        function testVueApp() {
            const resultsDiv = document.getElementById('vue-results');
            
            // Test if Vue app is loaded
            if (window.Vue) {
                resultsDiv.innerHTML += `<p class="success">✓ Vue.js is loaded</p>`;
            } else {
                resultsDiv.innerHTML += `<p class="error">✗ Vue.js not found</p>`;
            }

            // Test if app is mounted
            const appElement = document.getElementById('app');
            if (appElement) {
                resultsDiv.innerHTML += `<p class="success">✓ App element found</p>`;
            } else {
                resultsDiv.innerHTML += `<p class="error">✗ App element not found</p>`;
            }
        }

        // Auto-run basic tests
        window.onload = function() {
            console.log('Starting API tests...');
            
            // Test basic routes
            setTimeout(() => testRoute('/'), 1000);
            setTimeout(() => testRoute('/admin'), 2000);
            
            // Test Vue app
            setTimeout(() => testVueApp(), 3000);
        };
    </script>
</body>
</html>
